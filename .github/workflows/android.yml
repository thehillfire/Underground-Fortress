name: Android launcher
# Builds the one-tap "Fortress" launcher APK (wakes Termux, then opens the app).
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write   # to put the built APK into public/downloads, so the phone can download it from the fortress itself
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (the runner already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Put the APK where the app serves it
        if: github.event_name == 'push'
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/fortress-launcher.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/fortress-launcher.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build launcher APK [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
