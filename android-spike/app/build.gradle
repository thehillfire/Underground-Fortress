plugins { id 'com.android.application' }
android {
    namespace 'com.fortress.spike'
    compileSdk 34
    defaultConfig {
        applicationId 'com.fortress.spike'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    packaging {
        // Keep the bundled program as a real file in nativeLibraryDir, so it can be executed.
        jniLibs { useLegacyPackaging true }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
