<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0a0c">
  <title>Underground Fortress</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <header id="hud">
    <div class="brand">UNDERGROUND FORTRESS <span id="conn"></span></div>
    <div id="stats"></div>
  </header>
  <div id="ticker"></div>

  <aside id="panel" aria-hidden="true">
    <div class="panel-head">
      <div class="grip"></div>
      <h3 id="panel-title"></h3>
      <button id="panel-close" aria-label="Close">X</button>
    </div>
    <div id="armory-tabs" class="seg" hidden>
      <button data-tab="repos">REPOS</button><button data-tab="connectors">APPS</button><button data-tab="skills">SKILLS</button>
    </div>
    <div id="panel-body"></div>
  </aside>

  <div id="feed"></div>
  <div id="controls">
    <button id="home" title="Back to command">&#8962;</button>
    <button id="zoom-out" title="Zoom out">-</button>
    <button id="zoom-in" title="Zoom in">+</button>
  </div>
  <button id="mic" title="Talk (M)"><span class="mic-ico"></span><span>TALK</span></button>
  <div id="transcript"></div>
  <div id="toasts"></div>

  <nav id="nav">
    <button data-tab="base" class="active"><i class="ico ico-base"></i><span>BASE</span></button>
    <button data-tab="lidia"><i class="ico ico-lidia"></i><span>LIDIA</span></button>
    <button id="btn-new" class="dig"><i class="ico ico-dig"></i><span>DIG</span></button>
    <button data-tab="connectors" data-armory><i class="ico ico-armory"></i><span>ARMORY</span></button>
    <button data-tab="settings"><i class="ico ico-settings"></i><span>SETUP</span></button>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
